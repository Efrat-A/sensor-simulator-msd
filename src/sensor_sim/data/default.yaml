# Default scenario: Region A and Region B are two disjoint axis-aligned
# boxes on the (X, Y) plane, separated by a clear gap -- never touching,
# never overlapping. The route swings through open space, into A, back out,
# across the gap, into B, and back out again.
#
# This file is the "configurable in code without touching code" surface the
# assignment asks for: region corners, motion profile, sensor noise, and
# classifier sensitivity are all data here, not constants in the Python.

regions:
  A:
    low: [0.0, 0.0]
    high: [10.0, 10.0]
  B:
    low: [22.0, -4.0]
    high: [32.0, 6.0]

motion:
  waypoints:
    - [-15.0, -8.0]
    - [5.0, 5.0] # inside Region A
    - [16.0, -9.0] # outside, between the two regions
    - [27.0, 1.0] # inside Region B
    - [45.0, 10.0]
  avg_speed: 2.2 # m/s
  speed_variability: 0.6 # relative amplitude of the speed oscillation
  speed_noise_std: 0.15
  speed_period: 14.0 # seconds per speed-up/slow-down cycle
  min_speed: 0.3
  waypoint_tolerance: 0.6
  seed: 42

sensor:
  noise_std: 0.15 # Gaussian noise added to each distance reading

classifier:
  crossing_threshold: 0.3 # how close to an edge counts as "crossing" it
  rearm_threshold: 1.5 # must recede past this before the next crossing can register
  # rearm_threshold must stay below both regions' half-widths (5.0 and 5.0 here)

simulation:
  dt: 0.1 # seconds of simulated time per tick
  duration: 180.0 # seconds of simulated time; null = run until Ctrl+C
  realtime_factor: 8.0 # 8x: a satisfying demo without actually waiting 3 minutes
