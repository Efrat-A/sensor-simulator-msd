# Example custom scenario: Region A and Region B genuinely overlap (A's
# upper half coincides with B's lower half), demonstrating that the
# classifier and config loader support overlapping regions just as well as
# disjoint or merely-adjacent ones -- RealTimeClassifier always returns a
# single state, with Region A taking priority while inside the shared span.
#
# Run with:
#   sensor-sim --config configs/overlap_scenario.yaml

regions:
  A:
    low: 0.0
    high: 10.0
  B:
    low: 6.0
    high: 16.0 # overlaps Region A over [6, 10]

motion:
  waypoints:
    - -10.0
    - 8.0 # inside the A/B overlap
    - 25.0
  avg_speed: 2.5
  speed_variability: 0.5
  speed_noise_std: 0.15
  speed_period: 12.0
  min_speed: 0.3
  waypoint_tolerance: 0.6
  seed: 3

sensor:
  noise_std: 0.15

classifier:
  crossing_threshold: 0.3
  rearm_threshold: 1.0
  # rearm_threshold must stay below both regions' half-widths (5.0 each here)

simulation:
  dt: 0.1
  duration: 150.0
  realtime_factor: 6.0
