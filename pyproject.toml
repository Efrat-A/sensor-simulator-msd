[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensor-sim"
version = "0.1.0"
description = "Real-time classification (In A / In B / Outside) of a simulated 2D GPS sensor from boundary-distance readings only"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Efrat A" }]
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "mypy>=1.8",
    "allure-pytest>=2.13",
]

[project.scripts]
sensor-sim = "sensor_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sensor_sim = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
